<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leaf Classifier — live camera</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0 auto; padding: 16px; max-width: 560px; }
  h1 { font-size: 1.35rem; margin-bottom: 2px; }
  .sub { margin: 0 0 10px; color: #666; font-size: .9rem; }
  #status { padding: 8px 10px; border-radius: 8px; background: #eef; margin: 8px 0; font-size: .9rem; }
  #status.error { background: #fdd; }
  #status.ok { background: #dfd; }
  #stage { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #000; border-radius: 12px; overflow: hidden; }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #stage .hint { position: absolute; left: 0; right: 0; bottom: 0; color: #fff; background: rgba(0,0,0,.45); font-size: .75rem; text-align: center; padding: 4px; }
  .controls { display: flex; gap: 10px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
  button, .filelabel { padding: 9px 16px; border-radius: 8px; border: 1px solid #888; background: #f4f4f4; cursor: pointer; font-size: .95rem; }
  input[type=file] { display: none; }
  #results { margin-top: 6px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
  .row .name { width: 78px; font-weight: 600; }
  .row .bar { flex: 1; height: 14px; background: #ddd; border-radius: 7px; overflow: hidden; }
  .row .bar > div { height: 100%; width: 0%; background: #7fb2e5; transition: width .15s linear; }
  .row.top .bar > div { background: #1a7f37; }
  .row .pct { width: 70px; text-align: right; font-variant-numeric: tabular-nums; font-size: .9rem; }
  #meta { color: #666; font-size: .8rem; margin-top: 4px; }
  #qr { display: flex; gap: 16px; align-items: center; border-top: 2px solid #aaa; margin-top: 28px; padding-top: 16px; }
  #qrcode svg { width: 170px; height: 170px; display: block; background: #fff; padding: 4px; }
  #qr .caption { font-size: .95rem; }
  #qr a { word-break: break-all; }
</style>
</head>
<body>
<h1>🍃 Leaf Classifier</h1>
<p class="sub">apple · cherry · chestnut · maple — ONNX model running in your browser</p>

<div id="status">Loading model…</div>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <div class="hint">the central square of the frame is analysed</div>
</div>

<div class="controls">
  <button id="camBtn" type="button">Start / restart camera</button>
  <label class="filelabel">Upload photo<input type="file" id="fileInput" accept="image/*"></label>
</div>

<div id="results"></div>
<div id="meta"></div>
<canvas id="proc" width="96" height="96" hidden></canvas>
<div id="selftest" hidden></div>

<section id="qr">
  <div id="qrcode" data-url="https://michaela-rousova.github.io/mlr-ex08/"></div>
  <div class="caption">
    <strong>Scan to open this page on your phone</strong><br>
    <a id="qrLink" href="https://michaela-rousova.github.io/mlr-ex08/">https://michaela-rousova.github.io/mlr-ex08/</a>
  </div>
</section>

<!-- QR generation happens locally in the browser (qrcode-generator computes the
     code from the URL string here; no external QR-image service is involved). -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module">
import * as ort from 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/ort.min.mjs';

const SELFTEST = new URLSearchParams(location.search).has('selftest');

// iOS/Safari (GitHub Pages cannot send COOP/COEP headers, so SharedArrayBuffer
// and therefore threaded WASM is unavailable): force single-threaded WASM,
// otherwise session creation hangs on iPhone Safari.
ort.env.wasm.numThreads = 1;
ort.env.wasm.proxy = false;
ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/';

const statusEl = document.getElementById('status');
const setStatus = (msg, cls = '') => { statusEl.textContent = msg; statusEl.className = cls; };

// ---- model + preprocessing description come from model_info.json ----------
const INFO = await fetch('model_info.json').then(r => r.json());
const N = INFO.input_size;
const MEAN = INFO.mean, STD = INFO.std;

proc.width = N; proc.height = N;
const pctx = proc.getContext('2d', { willReadFrequently: true });

let session, INPUT_NAME, OUT_NAME;
try {
  session = await ort.InferenceSession.create('leaf_model.onnx', {
    executionProviders: ['wasm'],
    graphOptimizationLevel: 'all',
  });
  INPUT_NAME = session.inputNames[0];   // 'image'
  OUT_NAME = session.outputNames[0];    // 'logits'
} catch (e) {
  setStatus('Failed to load the ONNX model: ' + e.message, 'error');
  throw e;
}

// Preprocessing, exactly as in model_info.json:
// central-square crop -> resize to N x N -> RGB /255 -> (x-mean)/std -> CHW 1x3xNxN
function preprocessToTensor(srcEl, sw, sh) {
  const s = Math.min(sw, sh);
  const sx = (sw - s) / 2, sy = (sh - s) / 2;
  pctx.imageSmoothingEnabled = true;
  if ('imageSmoothingQuality' in pctx) pctx.imageSmoothingQuality = 'high';
  pctx.drawImage(srcEl, sx, sy, s, s, 0, 0, N, N);
  const d = pctx.getImageData(0, 0, N, N).data;   // RGBA, row-major
  const HW = N * N;
  const chw = new Float32Array(3 * HW);
  for (let i = 0; i < HW; i++) {
    chw[i]         = (d[4 * i]     / 255 - MEAN[0]) / STD[0];
    chw[HW + i]    = (d[4 * i + 1] / 255 - MEAN[1]) / STD[1];
    chw[2 * HW + i] = (d[4 * i + 2] / 255 - MEAN[2]) / STD[2];
  }
  return new ort.Tensor('float32', chw, [1, 3, N, N]);
}

function softmax(arr) {
  const m = Math.max(...arr);
  const e = Array.from(arr, v => Math.exp(v - m));
  const s = e.reduce((a, b) => a + b, 0);
  return e.map(v => v / s);
}

async function classify(srcEl, sw, sh) {
  const tensor = preprocessToTensor(srcEl, sw, sh);
  const t0 = performance.now();
  const out = await session.run({ [INPUT_NAME]: tensor });
  const ms = performance.now() - t0;
  const probs = softmax(out[OUT_NAME].data);   // model output is raw logits
  return { probs, ms };
}

// ---- results UI ------------------------------------------------------------
const resultsEl = document.getElementById('results');
const metaEl = document.getElementById('meta');
const rows = INFO.classes.map(c => {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<span class="name"></span><span class="bar"><div></div></span><span class="pct"></span>`;
  row.querySelector('.name').textContent = c;
  resultsEl.appendChild(row);
  return row;
});

function render(probs, label, ms) {
  let best = 0;
  probs.forEach((p, i) => { if (p > probs[best]) best = i; });
  probs.forEach((p, i) => {
    rows[i].querySelector('div').style.width = (p * 100).toFixed(1) + '%';
    rows[i].querySelector('.pct').textContent = (p * 100).toFixed(2) + '%';
    rows[i].classList.toggle('top', i === best);
  });
  metaEl.textContent = `${label} · ${INFO.classes[best]} ${(probs[best] * 100).toFixed(1)}% · ${ms.toFixed(0)} ms`;
}

// ---- live camera ------------------------------------------------------------
const video = document.getElementById('video');
let stream = null, loopStop = true, busy = false;

function videoReady() {
  return new Promise(res => {
    if (video.readyState >= 2) return res();
    const ok = () => { video.removeEventListener('loadeddata', ok); res(); };
    video.addEventListener('loadeddata', ok);
  });
}

async function startCamera() {
  loopStop = true;                       // stop previous loop, if any
  if (stream) stream.getTracks().forEach(t => t.stop());
  const tries = [
    { audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } },
    { audio: false, video: true },
  ];
  let err = null;
  for (const c of tries) {
    try { stream = await navigator.mediaDevices.getUserMedia(c); err = null; break; }
    catch (e) { err = e; }
  }
  if (err) {
    setStatus(`Camera unavailable (${err.name}: ${err.message}). Use “Upload photo” instead — the camera needs permission and a secure (https) page.`, 'error');
    return;
  }
  video.srcObject = stream;
  try { await video.play(); } catch (e) {}
  await videoReady();
  setStatus(`Classifying live with the rear camera… (${video.videoWidth}×${video.videoHeight})`, 'ok');
  loopStop = false;
  loop();
}

async function loop() {
  if (loopStop) return;
  if (!busy && video.readyState >= 2 && video.videoWidth > 0) {
    busy = true;
    try {
      const { probs, ms } = await classify(video, video.videoWidth, video.videoHeight);
      render(probs, 'live camera', ms);
    } catch (e) {
      setStatus('Inference error: ' + e.message, 'error');
    }
    busy = false;
  }
  setTimeout(loop, 120);
}

document.getElementById('camBtn').addEventListener('click', startCamera);

// ---- photo upload fallback ----------------------------------------------------
function loadBitmap(file) {
  if ('createImageBitmap' in window) {
    return createImageBitmap(file).catch(() => loadViaImg(file));
  }
  return loadViaImg(file);
}
function loadViaImg(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('could not decode image'));
    img.src = URL.createObjectURL(file);
  });
}

document.getElementById('fileInput').addEventListener('change', async ev => {
  const f = ev.target.files[0];
  if (!f) return;
  try {
    const bmp = await loadBitmap(f);
    const w = bmp.width, h = bmp.height;
    const { probs, ms } = await classify(bmp, w, h);
    render(probs, 'uploaded photo', ms);
    setStatus(`Classified uploaded photo “${f.name}”.`, 'ok');
    if (bmp.close) bmp.close();
  } catch (e) {
    setStatus('Could not classify the uploaded photo: ' + e.message, 'error');
  }
  ev.target.value = '';
});

// ---- self-test (?selftest=1): run check_image.jpg through the exact
// same browser pipeline and compare with check_expected.json -----------------
if (SELFTEST) {
  try {
    const blob = await (await fetch('check_image.jpg')).blob();
    const bmp = await loadBitmap(blob);
    const { probs } = await classify(bmp, bmp.width, bmp.height);
    if (bmp.close) bmp.close();
    const exp = await (await fetch('check_expected.json')).json();
    const map = {};
    let maxdiff = 0;
    INFO.classes.forEach((c, i) => { map[c] = probs[i]; maxdiff = Math.max(maxdiff, Math.abs(probs[i] - exp[c])); });
    const el = document.getElementById('selftest');
    el.dataset.maxdiff = String(maxdiff);
    el.textContent = JSON.stringify(map);
    document.title = 'SELFTEST_DONE maxdiff=' + maxdiff.toExponential(2);
  } catch (e) {
    document.title = 'SELFTEST_FAILED ' + e.message;
  }
} else {
  setStatus('Model loaded. Starting camera…', 'ok');
  startCamera();   // triggers the permission prompt; “Start camera” button can retry
}

// ---- QR code for this page's public URL, computed locally in the browser ----
const PAGE_URL = document.getElementById('qrcode').dataset.url;
const qr = qrcode(0, 'M');            // typeNumber 0 = auto-size, error level M
qr.addData(PAGE_URL);
qr.make();
document.getElementById('qrcode').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
</script>
</body>
</html>
